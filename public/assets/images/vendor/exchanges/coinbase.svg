<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Coinbase</title>
  <!-- The white "C" is negative space: a ring, a centre dot, and the bar that joins them, which is what
       breaks the ring open on the right. Drawn as primitives so it stays exact at any size. -->
  <g fill="#0052FF">
    <circle cx="16" cy="16" r="13.38" fill="none" stroke="#0052FF" stroke-width="5.25"/>
    <circle cx="16" cy="16" r="5.47"/>
    <rect x="16" y="14.99" width="11.15" height="2.02"/>
  </g>
</svg>
