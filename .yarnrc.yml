compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: node-modules

# Mirrors the revoke.cash setting: packages published within the last 7 days are quarantined as a
# supply-chain safety measure. @revoke.cash/chains is pre-approved because it publishes weekly.
npmMinimalAgeGate: 7d

npmPreapprovedPackages:
  - "@revoke.cash/chains"
